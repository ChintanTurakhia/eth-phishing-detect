[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @virtual-sim/shared build && pnpm --filter @virtual-sim/core build && pnpm --filter @virtual-sim/server build"

[deploy]
startCommand = "node packages/server/dist/index.js"
healthcheckPath = "/api/state"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[volumes]]
mountPath = "/data"
